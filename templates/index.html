<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rankine Cycle Visualizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <h1>Rankine Cycle Visualizer</h1>
      <p class="tagline">Interactive thermodynamics explorer</p>
    </div>
  </div>
</header>
<main class="container main-grid">
  <aside class="panel input-panel" aria-labelledby="inputs-heading">
    <h2 id="inputs-heading">Inputs</h2>
    <div class="form-group">
      <label for="P_boiler">Boiler Pressure (bar)</label>
      <input type="number" id="P_boiler" value="80">
    </div>
    <div class="form-group">
      <label for="P_condenser">Condenser Pressure (bar)</label>
      <input type="number" id="P_condenser" value="0.08">
    </div>
    <div class="form-group">
      <label for="T_turbine_inlet">Turbine Inlet Temp (°C)</label>
      <input type="number" id="T_turbine_inlet" value="500">
    </div>
    <div class="form-group">
      <label for="pump_efficiency">Pump Efficiency</label>
      <input type="number" step="0.01" id="pump_efficiency" value="0.85">
    </div>
    <div class="form-group">
      <label for="turbine_efficiency">Turbine Efficiency</label>
      <input type="number" step="0.01" id="turbine_efficiency" value="0.85">
    </div>
    <button class="primary" onclick="calculateCycle()">Calculate</button>
    <p class="note">Tip: use the default values or adjust and press Calculate to update diagrams and states.</p>
  </aside>

  <section class="panel results-panel" aria-labelledby="results-heading">
    <h2 id="results-heading">States</h2>
    <div class="table-container">
      <table id="statesTable">
        <thead>
          <tr>
            <th>Point</th><th>T (K)</th><th>P (Pa)</th><th>h (J/kg)</th><th>s (J/kg·K)</th><th>v (m³/kg)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h3>T-s Diagram</h3>
        <!-- Keep both id variants for compatibility with existing scripts -->
        <div id="ts_chart" class="chart">
          <div id="tsChart" class="chart-canvas"></div>
        </div>
      </div>

      <div class="chart-card">
        <h3>P-v Diagram</h3>
        <div id="pv_chart" class="chart">
          <div id="pvChart" class="chart-canvas"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <small>Designed for teaching — UI refreshed.</small>
  </div>
</footer>

<script src="/static/script.js"></script>
<!-- Inline compatibility wrapper: if the main script plots into tsChart/pvChart or ts_chart/pv_chart, both will be present. -->
</body>
</html>
